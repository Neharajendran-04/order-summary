<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bungee&family=Caveat:wght@400..700&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Fjalla+One&family=Germania+One&family=Great+Vibes&family=Lilita+One&family=Montenegrin+Gothic+One&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Young+Serif&display=swap"
    rel="stylesheet">

  <title>Frontend Mentor | Order summary card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --blue-100: hsl(225, 100%, 94%);
      --blue-50: hsl(225, 100%, 98%);
      --blue-950: hsl(223, 47%, 23%);
      --gray-600: hsl(224, 23%, 55%);
      --blue-700: hsl(245, 75%, 52%);

      /* font */
      --redhat: "Red Hat Display", sans-serif;
    }

    body {
      background-image: url("./images/pattern-background-desktop.svg");
      background-repeat: no-repeat;

      background-color: var(--blue-100);
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }

    main {
      background-color: white;
      width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      overflow: hidden;
    }

    main>img {
      width: 100%;
      margin-bottom: 30px;
    }

    h1 {
      color: var(--blue-950);
      font-family: var(--redhat);
      margin-bottom: 20px;
      font-weight: 900;
      text-align: center;
    }

    .content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0px 40px;
    }

    .para {
      color: var(--gray-600);
      font-family: var(--redhat);
      font-weight: 500;
      max-width: 350px;
      text-align: center;
      line-height: 1.5;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .annualplan {
      font-family: var(--redhat);
      display: flex;
      align-items: center;
      background-color: var(--blue-50);
      margin-bottom: 30px;
      padding: 20px 15px;
      width: 100%;
      border-radius: 10px;
      gap: 20px;
    }

    .annualplanchild {
      display: flex;
      min-width: 0;
      flex-direction: column;

    }

    .annualplanchild>.annualhead {
      color: var(--blue-950);
      font-weight: 900;
      font-size: 15px;
    }

    .annualplanchild>.price {
      color: var(--gray-600);
      font-weight: 500;
    }

    .link {
      color: var(--blue-700);
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s ease;
      margin-left: auto;

    }

    .link:hover {
      text-decoration: none;
      opacity: 0.7;
    }

    button {
      border: none;
      background-color: var(--blue-700);
      color: white;
      padding: 12px;
      width: 100%;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 20px;
      box-shadow: 0 10px 20px hsla(245, 75%, 52%, 0.3);
      transition: opacity 0.2s ease;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;

    }

    .cancel {
      font-family: var(--redhat);
      color: var(--gray-600);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      transition: color 0.2s ease;
      margin-bottom: 40px;
    }

    .cancel:hover {
      color: var(--blue-950);
    }

    @media (max-width:375px) {
      body {
        background-image: url('./images/pattern-background-mobile.svg');
        background-repeat: no-repeat;
        padding: 20px;
      }

      .link {
        font-size: 14px;
      }

      .annualplan {
        gap: 10px;
      }

      .content {
        padding: 0 20px;
      }



    }
  </style>
</head>

<body>
  <main>
    <img src="./images/illustration-hero.svg" alt="hero image">
    <div class="content">
      <h1> Order Summary</h1>

      <p class="para">
        You can now listen to millions of songs, audiobooks, and podcasts on any
        device anywhere you like!
      </p>

      <div class="annualplan">
        <img src="./images/icon-music.svg" alt="music-icon">
        <div class="annualplanchild">
          <p class="annualhead"> Annual Plan</p>
          <p class="price">$59.99/year</p>
        </div>

        <a class="link" href="">Change</a>
      </div>

      <button>Proceed to Payment</button>
      <p class="cancel"> Cancel Order</p>
    </div>
  </main>

</body>

</html>
